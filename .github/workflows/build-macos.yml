# ============================================================================
# 语境输入法 macOS 版 - 自动构建与打包
#
# 触发方式：
#   1. 推送 tag（v*）            → 构建并发布 Release
#   2. 手动触发（workflow_dispatch）→ 构建并上传 artifact
#   3. 推送 main/master 分支      → 构建验证（不发布）
#
# 在 macOS-14 runner 上运行，使用 Homebrew 安装 librime，
# 调用 macos/scripts/package.sh 完成打包，生成 .dmg 安装镜像。
# ============================================================================

name: Build macOS Installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（用于命名安装包，留空则使用 run number）'
        required: false
        default: ''

permissions:
  contents: write   # 发布 Release 需要

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install librime via Homebrew
        run: |
          brew update
          brew install librime

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          else
            VER="0.0.0-dev${{ github.run_number }}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "版本号: $VER"

      - name: Build and package
        run: |
          cd macos
          bash scripts/package.sh

      - name: Rename dmg with version
        run: |
          cd macos/dist
          ls -la
          # package.sh 输出文件名为 语境输入法-<Info.plist 版本>.dmg
          # 统一改名为带 CI 版本号
          for f in *.dmg; do
            if [[ -f "$f" ]]; then
              mv "$f" "语境输入法-${{ steps.ver.outputs.version }}.dmg"
            fi
          done
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOInputMethod-macOS-${{ steps.ver.outputs.version }}
          path: macos/dist/*.dmg
          retention-days: 30

      - name: Publish Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 语境输入法 ${{ steps.ver.outputs.version }}
          body: |
            # 语境输入法 v${{ steps.ver.outputs.version }}

            ## macOS 安装方法
            1. 下载下方的 `语境输入法-${{ steps.ver.outputs.version }}.dmg`
            2. 双击挂载 dmg，将「语境输入法安装器」拖到「应用程序」文件夹
            3. 打开「应用程序」中的「语境输入法安装器」，按提示完成安装
            4. 打开「系统设置 > 键盘 > 输入法」，添加「语境输入法」
            5. 授予输入法辅助功能权限（系统会自动提示）

            ## 系统要求
            - macOS 13 Ventura 或更高版本
            - Apple Silicon 或 Intel 处理器

            ## 注意
            - 未用 Apple 开发者证书签名，首次打开需在「系统设置 > 隐私与安全性」中允许
          files: macos/dist/*.dmg
          draft: false
          prerelease: false
