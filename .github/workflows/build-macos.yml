# ============================================================================
# 语境输入法 macOS 版 - 自动构建与打包
#
# 触发方式：
#   1. 推送 tag（v*）            → 双架构构建后发布 Release
#   2. 手动触发（workflow_dispatch）→ 双架构构建并上传 artifact
#   3. 推送 main/master 分支      → 双架构构建验证（不发布）
#
# 架构策略：
#   - arm64  : macos-14（Apple Silicon），主力发布架构
#   - x86_64 : macos-15-intel（Intel），供 macOS 26 及更早的 Intel Mac 使用
#              ⚠️ macOS 26 是最后一个支持 Intel Mac 的系统；GitHub 的 x86_64 镜像
#              已确认 2027-08 退役，之后要么自托管 Intel 机器，要么停止支持。
#
# 打包脚本不写死架构（全部由 lipo -archs 自适应），两个 runner 跑的是同一套脚本。
# ============================================================================

name: Build macOS Installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（用于命名安装包，留空则使用 run number）'
        required: false
        default: ''

permissions:
  contents: write   # 发布 Release 需要

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 保留 tag：脚本在未显式传 LO_VERSION 时会尝试用 tag 解析版本号
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install librime via Homebrew
        run: |
          brew update
          brew install librime

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          else
            VER="0.0.0-dev${{ github.run_number }}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "版本号: $VER"

      - name: Build and package
        env:
          # tag 版本（纯数字）会被写进 payload / 安装器 / 卸载工具的 Info.plist
          LO_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd macos
          bash scripts/package.sh

      - name: Read package compatibility
        id: compatibility
        run: |
          APP="macos/.build/staging/payload/LOInputMethod.app"
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          BINARY_ARCH=$(lipo -archs "$APP/Contents/MacOS/LOInputMethod")
          echo "min_os=$MIN_OS" >> "$GITHUB_OUTPUT"
          echo "plist_version=$PLIST_VERSION" >> "$GITHUB_OUTPUT"
          echo "实际架构: $BINARY_ARCH / 最低系统: macOS $MIN_OS / 版本: $PLIST_VERSION"
          # 双架构流水线最容易犯的错：跑错 runner，或复用了别处残留的 .build。
          # 产物架构必须与矩阵声明一致，否则直接失败。
          case " $BINARY_ARCH " in
            *" ${{ matrix.arch }} "*) ;;
            *) echo "::error::产物架构 [$BINARY_ARCH] 与矩阵声明 ${{ matrix.arch }} 不一致"; exit 1 ;;
          esac

      - name: Rename dmg with version
        run: |
          cd macos/dist
          ls -la
          # package.sh 输出：语境输入法-<版本>.dmg（内含安装器与卸载工具）
          VER="${{ steps.ver.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          for f in *.dmg; do
            [[ -f "$f" ]] || continue
            mv "$f" "LOInputMethod-$VER-$ARCH.dmg"
          done
          ls -la

      - name: Write build info
        run: |
          cd macos/dist
          cat > "build-info-${{ matrix.arch }}.json" <<EOF
          {
            "arch": "${{ matrix.arch }}",
            "min_os": "${{ steps.compatibility.outputs.min_os }}",
            "version": "${{ steps.ver.outputs.version }}",
            "plist_version": "${{ steps.compatibility.outputs.plist_version }}"
          }
          EOF
          cat "build-info-${{ matrix.arch }}.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOInputMethod-macOS-${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          path: |
            macos/dist/*.dmg
            macos/dist/build-info-*.json
          retention-days: 30

  # 发布单独成一个 job：两个架构并发上传同一个 Release 会互相覆盖元数据，
  # 这里等两边都构建完，统一收集 dmg 再发布一次。
  publish:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - name: Checkout templates
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compose release notes
        run: |
          ls -la artifacts
          python3 - <<'PY'
          import json, pathlib

          artifacts = pathlib.Path("artifacts")
          infos = [json.loads(p.read_text()) for p in sorted(artifacts.glob("build-info-*.json"))]
          if not infos:
              raise SystemExit("没有找到 build-info，无法生成发布说明")

          order = {"arm64": 0, "x86_64": 1}
          infos.sort(key=lambda i: order.get(i["arch"], 99))
          version = infos[0]["version"]

          rows = ["| 芯片 | 安装包 | 最低系统 |", "|------|--------|----------|"]
          for info in infos:
              chip = "Apple Silicon（M 系列）" if info["arch"] == "arm64" else "Intel"
              name = f"LOInputMethod-{info['version']}-{info['arch']}.dmg"
              rows.append(f"| {chip} | `{name}` | macOS {info['min_os']} 或更高 |")

          template = pathlib.Path(".github/release-notes.md.tmpl").read_text()
          notes = template.replace("{{VERSION}}", version).replace("{{PACKAGES}}", "\n".join(rows))
          pathlib.Path("release-notes.md").write_text(notes)
          print(notes)
          PY

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 语境输入法 ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*.dmg
          draft: false
          prerelease: false
