# ============================================================================
# 语境输入法 macOS 版 - 自动构建与打包
#
# 触发方式：
#   1. 推送 tag（v*）            → 构建并发布 Release
#   2. 手动触发（workflow_dispatch）→ 构建并上传 artifact
#   3. 推送 main/master 分支      → 构建验证（不发布）
#
# 在 macOS-14 runner 上运行，使用 Homebrew 安装 librime，
# 调用 macos/scripts/package.sh 完成打包，生成 .dmg 安装镜像。
# ============================================================================

name: Build macOS Installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（用于命名安装包，留空则使用 run number）'
        required: false
        default: ''

permissions:
  contents: write   # 发布 Release 需要

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install librime via Homebrew
        run: |
          brew update
          brew install librime

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          else
            VER="0.0.0-dev${{ github.run_number }}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "版本号: $VER"

      - name: Build and package
        run: |
          cd macos
          bash scripts/package.sh

      - name: Read package compatibility
        id: compatibility
        run: |
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' macos/.build/staging/payload/LOInputMethod.app/Contents/Info.plist)
          echo "min_os=$MIN_OS" >> "$GITHUB_OUTPUT"

      - name: Rename dmg with version
        run: |
          cd macos/dist
          ls -la
          # package.sh 输出：语境输入法-<版本>.dmg（内含安装器与卸载工具）
          VER="${{ steps.ver.outputs.version }}"
          ARCH="${{ steps.compatibility.outputs.arch }}"
          for f in *.dmg; do
            [[ -f "$f" ]] || continue
            mv "$f" "LOInputMethod-$VER-$ARCH.dmg"
          done
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOInputMethod-macOS-${{ steps.ver.outputs.version }}-${{ steps.compatibility.outputs.arch }}
          path: macos/dist/*.dmg
          retention-days: 30

      - name: Upload to Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 语境输入法 ${{ steps.ver.outputs.version }}
          body: |
            # 语境输入法 v${{ steps.ver.outputs.version }}

            边写边翻译的智能输入法，本版本仅提供 macOS 版本。

            ## 下载安装

            ### macOS

            1. 下载 `LOInputMethod-${{ steps.ver.outputs.version }}-${{ steps.compatibility.outputs.arch }}.dmg`
            2. 双击挂载 dmg,将「语境输入法安装器」拖到「应用程序」文件夹
            3. 打开「应用程序」中的「语境输入法安装器」,按提示完成安装
            4. 打开「系统设置 > 键盘 > 输入法」,添加「语境输入法」
            5. 授予输入法辅助功能权限（系统会自动提示）

            **重装或测试前清理**：同一个 dmg 内还提供了「语境输入法卸载工具」，
            可清除程序副本、输入源注册、Rime 词库缓存与旧 API Key，避免旧版本残留干扰新版本。

            **本次 macOS 安装包**：${{ steps.compatibility.outputs.arch }}，要求 macOS ${{ steps.compatibility.outputs.min_os }} 或更高版本；当前只发布该架构的安装包。

            **注意**：未用 Apple 开发者证书签名,首次打开需在「系统设置 > 隐私与安全性」中允许

            ## 功能特点

            - 边写边翻译：打字的同时在悬浮窗实时显示译文，无需切换应用或复制粘贴
            - 两种翻译引擎：语境翻译（在线，微软 Edge，免费、免 API Key）与本地翻译 · 轻量（中文 → English，OPUS-MT，约 111 MB，离线可用）
            - 在线支持 21 种目标语言：英语、英式英语、日语、韩语、法语、德语、西班牙语、意大利语、葡萄牙语、巴西葡语、俄语、阿拉伯语、印地语、泰语、越南语、印尼语、荷兰语、波兰语、土耳其语、瑞典语、乌克兰语
            - 自动回退：本地语言包缺失或目标语言不支持时，可自动改用在线翻译
            - 拼音输入：基于 Rime 的朙月拼音引擎，候选窗支持数字选词、方向键导航与翻页
            - 悬浮窗可定制：位置（固定 / 拖动 / 跟随光标）、深色 / 浅色 / 跟随系统主题、透明度、颜色、字号、最大宽高、点击穿透
            - 一键复制：悬停悬浮窗出现复制按钮，也可用 ⌃⌘, 复制最近译文
            - 语音播报：使用系统语音离线朗读译文，语速可调
            - 三个开关相互独立：翻译、悬浮窗、语音播报可任意组合；关闭翻译时只显示、朗读原文
            - 删改同步：退格、删词、剪切或撤销后，译文立即回退或丢弃，不再翻译已删除的内容
            - 智能断句与防抖：停顿自动分段，连续输入只翻译最后一次，并缓存译文减少重复请求
            - 隐私优先：在线模式直连微软翻译接口，无需注册与 API Key；本地模式文本不出本机

            ## 快捷键

            | 功能 | 快捷键 |
            |------|--------|
            | 切换输入法 | Ctrl+Space |
            | 中英文切换 | 短按 Shift |
            | 系统输入源切换 | CapsLock（macOS 系统行为） |
            | 复制最近译文 | ⌃⌘, |
            | 选择候选词 | 1–9 |
            | 确认候选词 | Space |
            | 导航候选词 | ← →，↑ ↓ 翻页 |

            ## 反馈与问题

            如有问题或建议,请在 Issues 中反馈。
          files: macos/dist/*.dmg
          draft: false
          prerelease: false
