# ============================================================================
# 语境输入法 Windows 版 - 自动构建与打包
#
# 触发方式：
#   1. 推送 tag（v*）           → 构建并发布 Release
#   2. 手动触发（workflow_dispatch）→ 构建并上传 artifact
#   3. 推送 main/master 分支      → 构建验证（不发布）
#
# 使用方法（macOS 开发者）：
#   # 方式 A：手动触发，下载 artifact
#   gh workflow run build-windows.yml
#   gh run watch
#   gh run download
#
#   # 方式 B：打 tag 自动发布 Release
#   git tag v1.0.0
#   git push origin v1.0.0
#   # Release 页面会自动出现 exe 下载链接
# ============================================================================

name: Build Windows Installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（用于命名安装包，留空则使用 run number）'
        required: false
        default: ''

permissions:
  contents: write   # 发布 Release 需要

# librime 版本（从官方 release 下载 MSVC 预编译包）
env:
  RIME_VERSION: '1.17.0'
  RIME_ASSET: 'rime-33e7814-Windows-msvc-x64.7z'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Install 7zip (for extracting .7z)
        run: choco install 7zip -y --no-progress

      - name: Download and extract librime (MSVC x64 prebuilt)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/rime/librime/releases/download/${{ env.RIME_VERSION }}/${{ env.RIME_ASSET }}"
          Write-Host "下载 librime: $url"
          Invoke-WebRequest -Uri $url -OutFile "librime.7z"

          # 解压到 third_party/librime
          $rimeRoot = "windows/third_party/librime"
          New-Item -ItemType Directory -Force -Path $rimeRoot | Out-Null
          7z x librime.7z -o"$rimeRoot" -y

          # 列出解压内容,确认结构
          Write-Host "librime 解压内容:"
          Get-ChildItem -Recurse $rimeRoot | Select-Object FullName

          # 官方包结构为 dist/include, dist/lib, dist/bin
          # 调整为 CMakeLists.txt 期望的结构: include/, lib/, bin/
          $distDir = Join-Path $rimeRoot "dist"
          if (Test-Path $distDir) {
            Move-Item -Path (Join-Path $distDir "*") -Destination $rimeRoot -Force
            Remove-Item -Path $distDir -Recurse -Force
          }

          Write-Host "调整后的 librime 目录:"
          Get-ChildItem -Recurse $rimeRoot -Depth 1 | Select-Object FullName

      - name: Download rime-ice dict
        shell: bash
        run: |
          cd windows
          bash scripts/fetch-dict.sh || echo "词库下载失败，使用基础词库"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          else
            VER="0.0.0-dev${{ github.run_number }}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "版本号: $VER"

      - name: Find Windows SDK and set lib path
        shell: pwsh
        run: |
          # 搜索所有 SDK 版本中的 msctf.lib
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\Lib"
          $allFound = Get-ChildItem -Path $sdkRoot -Recurse -Filter "msctf.lib" -ErrorAction SilentlyContinue
          if ($allFound) {
            $found = $allFound | Select-Object -First 1
            $libDir = $found.DirectoryName
            Write-Host "找到 msctf.lib: $($found.FullName)"
            Write-Host "库目录: $libDir"
            Add-Content -Path $env:GITHUB_ENV -Value "LIB=$libDir;$env:LIB"
            Write-Host "已将 $libDir 添加到 LIB 环境变量"
          } else {
            Write-Host "未找到 msctf.lib,列出所有 SDK 版本的 um/x64 目录中的 msctf* 文件:"
            Get-ChildItem -Path $sdkRoot -Directory | ForEach-Object {
              $umX64 = Join-Path $_.FullName "um\x64"
              if (Test-Path $umX64) {
                Write-Host "  $umX64 :"
                Get-ChildItem $umX64 -Filter "msctf*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "    $($_.Name)" }
                Get-ChildItem $umX64 -Filter "*tf*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "    $($_.Name)" }
              }
            }
            # msctf.lib 可能不存在,用 msctf.dll 的动态链接替代
            # 创建一个空的 msctf.lib 或者用 delay-load
            Write-Host "##[warning]msctf.lib 不存在,将使用动态加载方式"
          }

      - name: Configure CMake
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cd windows
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release ^
            -DRIME_ROOT="%CD%\third_party\librime"

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cd windows
          cmake --build build --config Release --parallel

      - name: Copy rime.dll to output
        shell: pwsh
        run: |
          $dllSrc = "windows\third_party\librime\bin\rime.dll"
          $dllDst = "windows\build\bin\Release\rime.dll"
          if (Test-Path $dllSrc) {
            Copy-Item $dllSrc $dllDst -Force
            Write-Host "已复制 rime.dll 到输出目录"
          } else {
            Write-Host "警告：未找到 rime.dll,搜索其他位置..."
            Get-ChildItem -Path windows\third_party -Recurse -Filter "rime.dll" | ForEach-Object {
              Write-Host "  找到: $($_.FullName)"
              Copy-Item $_.FullName $dllDst -Force
            }
          }

      - name: Prepare package resources
        shell: cmd
        run: |
          copy /Y windows\installer\README.txt windows\build\bin\Release\README.txt

      - name: Build NSIS installer
        shell: cmd
        run: |
          if not exist windows\dist mkdir windows\dist
          cd windows\installer
          set NSIS_EXE=
          where makensis >nul 2>nul && set NSIS_EXE=makensis
          if not defined NSIS_EXE if exist "%ProgramFiles(x86)%\NSIS\makensis.exe" set NSIS_EXE="%ProgramFiles(x86)%\NSIS\makensis.exe"
          if not defined NSIS_EXE if exist "%ProgramFiles%\NSIS\makensis.exe" set NSIS_EXE="%ProgramFiles%\NSIS\makensis.exe"
          if not defined NSIS_EXE (
            echo 错误：未找到 NSIS
            exit /b 1
          )
          %NSIS_EXE% installer.nsi

      - name: Rename installer with version
        shell: bash
        run: |
          cd windows/dist
          ls -la
          for f in *-Setup-*.exe; do
            if [[ -f "$f" ]]; then
              mv "$f" "LOInputMethod-Setup-${{ steps.ver.outputs.version }}.exe"
            fi
          done
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOInputMethod-Setup-${{ steps.ver.outputs.version }}
          path: windows/dist/*.exe
          retention-days: 30

      - name: Upload to Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 语境输入法 ${{ steps.ver.outputs.version }}
          body: |
            # 语境输入法 v${{ steps.ver.outputs.version }}

            边写边翻译的智能输入法,支持 macOS 和 Windows 双平台。

            ## 下载安装

            根据你的操作系统选择对应安装包：

            ### macOS

            1. 下载 `语境输入法-${{ steps.ver.outputs.version }}.dmg`
            2. 双击挂载 dmg,将「语境输入法安装器」拖到「应用程序」文件夹
            3. 打开「应用程序」中的「语境输入法安装器」,按提示完成安装
            4. 打开「系统设置 > 键盘 > 输入法」,添加「语境输入法」
            5. 授予输入法辅助功能权限（系统会自动提示）

            **系统要求**：macOS 13 Ventura 或更高版本,Apple Silicon 或 Intel 处理器

            **注意**：未用 Apple 开发者证书签名,首次打开需在「系统设置 > 隐私与安全性」中允许

            ### Windows

            1. 下载 `LOInputMethod-Setup-${{ steps.ver.outputs.version }}.exe`
            2. 双击运行,按提示完成安装
            3. 打开「系统设置 > 时间和语言 > 语言和区域」
            4. 在「中文（简体）> 语言选项 > 键盘」中添加「语境输入法」
            5. 使用 Win+Space 切换到语境输入法

            **系统要求**：Windows 10 1809+ 或 Windows 11,64 位系统

            ## 功能特点

            - 边写边翻译：打字的同时实时翻译,无需切换应用
            - 语境翻译（免费）：基于微软 Edge 翻译接口,无需 API Key
            - 大模型翻译：支持 DeepSeek、GLM、Qwen、Kimi、OpenAI 等多种大模型
            - 流式输出：大模型翻译实时显示,降低首字延迟
            - 多语言支持：英文、中文、日文、韩文、法文、德文、西班牙文等 23 种语言
            - 悬浮窗：可自定义位置、大小、颜色、透明度

            ## 快捷键

            | 功能 | macOS | Windows |
            |------|-------|---------|
            | 切换输入法 | Ctrl+Space | Win+Space |
            | 中英文切换 | Shift | Shift |
            | 复制翻译内容 | Ctrl+Option+, | Ctrl+Alt+, |
            | 选择候选词 | 1-9 数字键 | 1-9 数字键 |
            | 确认候选词 | Space | Space |
            | 导航候选词 | 方向键 | 方向键 |

            ## 反馈与问题

            如有问题或建议,请在 Issues 中反馈。
          files: windows/dist/*.exe
          draft: false
          prerelease: false
